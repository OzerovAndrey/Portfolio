name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "tokens/**", "tools/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env:
          SITE_BASE: ${{ vars.SITE_BASE || '/Portfolio/' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://ozerovandrey.github.io' }}
          PUBLIC_FORM_ENDPOINT: ${{ vars.PUBLIC_FORM_ENDPOINT }}
          PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
